    <!-- MAIN -->
    <main class="container-fluid my-4">
    <div class="row g-4">
        <!-- SIDEBAR (static UI) -->
        <aside class="col-lg-3">
        <div class="card shadow-sm sticky-sidebar">
            <div class="card-header bg-white fw-semibold">
            <i class="fa fa-filter me-2"></i>Filters
            </div>
            <div class="card-body">
            <!-- Categories -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                <span class="facet-label"
                    ><i class="fa fa-solid fa-tags me-2"></i>Brands</span
                >
                </div>
                @for(brand of brands ;track $index){
                <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="cat1"
                    [checked]="storeParams.BrandId === brand.id"
                    [value]="brand.id"
                    (change)="onBrandSelected(brand.id)"
                /><label class="form-check-label" for="cat1">{{
                    brand.name
                }}</label>
                </div>
                }
            </div>

            <hr />

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                <span class="facet-label"
                    ><i class="fa fa-solid fa-tags me-2"></i>Types</span
                >
                </div>
                @for(type of types ;track $index){
                <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="cat1"
                    [checked]="storeParams.TypeId === type.id"
                    [value]="type.id"
                    (change)="onTypeSelected(type.id)"
                />
                <label class="form-check-label" for="cat1"
                    >{{ type.name }}
                </label>
                </div>
                }
            </div>

            <button class="btn btn-outline-secondary w-100" type="button" (click)="onReset()">
                <i class="fa-solid fa-arrow-rotate-left me-2"></i>Reset Filters
            </button>
            </div>
        </div>
        </aside>

        <!-- PRODUCTS -->
        <section class="col-lg-9">
        <!-- Toolbar -->
        <div
            class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-2"
        >
            <div class="input-group search-pill">
            <span class="input-group-text"
                ><i class="fa-solid fa-magnifying-glass"></i
            ></span>
            <input
                class="form-control"
                type="search"
                (keyup)="onSearch()"
                #search
                placeholder="Search products"
            />
            <button class="btn" type="button">
                <i class="fa-solid fa-xmark"></i>
            </button>
            </div>
            <div class="text-muted">
            Showing <strong>{{products.length}}</strong> of <strong>{{totalCount || products.length}}</strong> results
            </div>
            <div class="d-flex gap-2">
            <select class="form-select" (change)="onSortSelected($event.target)" >
                @for(item of sortOptions ;track $index){
                    <option [value]="item.value">{{item.name}}</option>
                }
            </select>
            <select class="form-select" (change)="onPageSizeChange($event)">
                <option value="12">12 / page</option>
                <option value="24">24 / page</option>
                <option value="50" selected>50 / page</option>
            </select>
            </div>
        </div>

        <!-- Grid -->
        <div class="row g-3">
            <!-- Repeatable static card pattern -->

            <!-- 7 more static examples -->
            @for(product of products ;track $index){
            <div class="col-4 col-md-4 col-xl-4">
            <app-product-items [product]="product"></app-product-items>
            </div>
            }
        </div>

        <!-- Pagination -->
        @if (totalCount > 0) {
        <div class="d-flex justify-content-center align-items-center mt-4">
            <pagination
                [boundaryLinks]="true"
                [totalItems]="totalCount"
                [itemsPerPage]="storeParams.PageSize"
                [maxSize]="10"
                [ngModel]="storeParams.PageIndex"
                (pageChanged)="onPageChanged($event)"
                previousText="&lsaquo;"
                nextText="&rsaquo;"
                firstText="&laquo;"
                lastText="&raquo;">
            </pagination>
        </div>
        }
        </section>
    </div>
    </main>
