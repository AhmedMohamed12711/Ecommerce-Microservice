<div class="card h-100 product-card border-0 shadow-sm rounded-4 overflow-hidden position-relative">
    <div class="ratio ratio-1x1 bg-light position-relative overflow-hidden">
        <img [src]="product?.imageFile || 'images/placeholder.png'" [alt]="product?.name || 'Product Image'" (error)="onImgError($event)" class="w-100 h-100 object-fit-cover" />
        <div class="position-absolute top-0 start-0 m-3">
            <button type="button" class="btn btn-sm btn-light rounded-circle shadow-sm p-2 text-danger border-0" (click)="toggleWishlist($event)" [title]="isWishlisted() ? 'Remove from Wishlist' : 'Add to Wishlist'">
                <i class="fa fs-6" [ngClass]="isWishlisted() ? 'fa-heart text-danger' : 'fa-heart-o text-muted'"></i>
            </button>
        </div>
        <div class="position-absolute top-0 end-0 m-3">
            <a [routerLink]="['/store', product?.id]" class="btn btn-sm btn-light rounded-circle shadow-sm p-2 text-primary" title="View Details">
                <i class="fa fa-eye fs-6"></i>
            </a>
        </div>
    </div>
    <div class="card-body d-flex flex-column p-3">
        <div class="d-flex align-items-center gap-1 text-warning small mb-1">
            <i class="fa fa-star"></i>
            <i class="fa fa-star"></i>
            <i class="fa fa-star"></i>
            <i class="fa fa-star"></i>
            <i class="fa fa-star-half-o"></i>
            <span class="text-muted ms-1">(4.5)</span>
        </div>
        <h6 class="card-title fw-bold text-dark text-truncate mb-2" [title]="product?.name || ''">
            {{product?.name}}
        </h6>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fs-5 fw-extrabold text-primary">{{product?.price | currency}}</span>
            <span class="badge bg-soft-primary text-primary rounded-pill px-2 py-1 small">In Stock</span>
        </div>

        <div class="mt-auto d-grid">
            <button class="btn btn-primary rounded-pill py-2 d-flex align-items-center justify-content-center gap-2" type="button" (click)="addItemBasket()">
                <i class="fa fa-cart-plus"></i> Add to Cart
            </button>
        </div>
    </div>
</div>
