<div class="toast-container position-fixed bottom-0 end-0 p-3 z-3">
  <div *ngFor="let toast of (toastService.toasts$ | async)" class="toast show glass-toast shadow-lg rounded-4 border-0 mb-3 animate-fade-in" role="alert">
    <div class="toast-body d-flex align-items-center justify-content-between p-3">
      <div class="d-flex align-items-center gap-3">
        <i class="fa fa-2x" [ngClass]="getIconClass(toast.type)"></i>
        <div>
          <h6 class="mb-0 fw-bold text-dark">{{ toast.title }}</h6>
          <small class="text-muted">{{ toast.message }}</small>
        </div>
      </div>
      <button type="button" class="btn-close ms-3" (click)="remove(toast.id)" aria-label="Close"></button>
    </div>
  </div>
</div>
