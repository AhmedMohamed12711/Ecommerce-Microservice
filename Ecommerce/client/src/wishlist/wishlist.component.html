<section class="container my-5 animate-fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0 text-uppercase">
      <i class="fa fa-heart text-danger me-2"></i>My Wishlist
    </h3>
    <div class="d-flex gap-2">
      <button *ngIf="((wishlistService.wishlist$ | async)?.length || 0) > 0" class="btn btn-outline-danger rounded-pill" (click)="clearAll()">
        <i class="fa fa-trash me-2"></i>Clear Wishlist
      </button>
      <a routerLink="/store" class="btn btn-outline-primary rounded-pill">
        <i class="fa fa-shopping-bag me-2"></i>Continue Shopping
      </a>
    </div>
  </div>

  <ng-container *ngIf="(wishlistService.wishlist$ | async) as items">
    <div *ngIf="items.length === 0" class="glass-card p-5 text-center">
      <i class="fa fa-heart-o fa-4x text-muted mb-3"></i>
      <h4 class="fw-bold">Your Wishlist is Empty</h4>
      <p class="text-muted">Explore our catalog and click the heart icon on any product to save it here!</p>
      <a routerLink="/store" class="btn btn-primary rounded-pill px-4 mt-2">
        Browse Products
      </a>
    </div>

    <div *ngIf="items.length > 0" class="row g-4">
      <div *ngFor="let item of items" class="col-md-6 col-lg-4 col-xl-3">
        <div class="card h-100 product-card border-0 shadow-sm rounded-4 overflow-hidden position-relative">
          <div class="ratio ratio-1x1 bg-light position-relative overflow-hidden">
            <img [src]="item.imageFile || 'images/placeholder.png'" [alt]="item.name" class="w-100 h-100 object-fit-cover" />
            <div class="position-absolute top-0 start-0 m-3">
              <button type="button" class="btn btn-sm btn-light rounded-circle shadow-sm p-2 text-danger border-0" (click)="removeFromWishlist(item)" title="Remove from Wishlist">
                <i class="fa fa-trash text-danger fs-6"></i>
              </button>
            </div>
            <div class="position-absolute top-0 end-0 m-3">
              <a [routerLink]="['/store', item.id]" class="btn btn-sm btn-light rounded-circle shadow-sm p-2 text-primary" title="View Details">
                <i class="fa fa-eye fs-6"></i>
              </a>
            </div>
          </div>
          <div class="card-body d-flex flex-column p-3">
            <div class="d-flex align-items-center gap-1 text-warning small mb-1">
              <i class="fa fa-star"></i>
              <i class="fa fa-star"></i>
              <i class="fa fa-star"></i>
              <i class="fa fa-star"></i>
              <i class="fa fa-star-half-o"></i>
              <span class="text-muted ms-1">(4.5)</span>
            </div>
            <h6 class="card-title fw-bold text-dark text-truncate mb-2" [title]="item.name">
              {{ item.name }}
            </h6>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="fs-5 fw-extrabold text-primary">${{ item.price.toFixed(2) }}</span>
              <span class="badge bg-soft-primary text-primary rounded-pill px-2 py-1 small">In Stock</span>
            </div>

            <div class="mt-auto d-grid">
              <button class="btn btn-primary rounded-pill py-2 d-flex align-items-center justify-content-center gap-2" type="button" (click)="addToCart(item)">
                <i class="fa fa-cart-plus"></i> Add to Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</section>
